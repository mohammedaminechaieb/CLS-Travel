# CLS Travel — Nginx reverse proxy
#   carthagoloisirs.com / www  -> frontend:3000
#   api.carthagoloisirs.com    -> backend:4000
# Certificats : Let's Encrypt (Certbot) dans /etc/letsencrypt/live/carthagoloisirs.com/

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;
  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # --- Rate limiting (couche edge ; l'API applique aussi un throttler Redis) ---
  limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=api_login:10m  rate=10r/m;
  limit_req_zone $binary_remote_addr zone=web_global:10m rate=20r/s;
  limit_req_status 429;

  upstream frontend_upstream { server frontend:3000; keepalive 32; }
  upstream backend_upstream  { server backend:4000;  keepalive 32; }

  # --- SSL commun ---
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;

  # Placeholder SSL — certificats émis par Certbot (voir infra/certbot/README.md)
  ssl_certificate     /etc/letsencrypt/live/carthagoloisirs.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/carthagoloisirs.com/privkey.pem;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # --- HTTP : challenge ACME + redirection HTTPS ---
  server {
    listen 80;
    listen [::]:80;
    server_name carthagoloisirs.com www.carthagoloisirs.com api.carthagoloisirs.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- www -> apex ---
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.carthagoloisirs.com;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://carthagoloisirs.com$request_uri;
  }

  # --- Frontend Next.js ---
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name carthagoloisirs.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location /_next/static/ {
      proxy_pass http://frontend_upstream;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location / {
      limit_req zone=web_global burst=40 nodelay;
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # --- API NestJS ---
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.carthagoloisirs.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /auth/login {
      limit_req zone=api_login burst=5 nodelay;
      proxy_pass http://backend_upstream;
    }

    location / {
      limit_req zone=api_global burst=50 nodelay;
      proxy_pass http://backend_upstream;
    }
  }
}
